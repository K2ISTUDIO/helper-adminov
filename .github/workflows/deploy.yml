name: Deploy to PlanetHoster

on:
  push:
    branches: [main]
    paths:
      - 'index.php'
      - '.github/workflows/deploy.yml'
      - '.user.ini'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:   node19-ca.n0c.com
          username: deploy@formails.fr
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir:  ./
          server-dir: public_html/formadom/
          include: |
            index.php
            info.php
            purge.php
            .user.ini
          log-level: verbose
          force-upload: true
